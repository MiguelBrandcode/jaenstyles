<!-- ============================================================
  BLOQUE DRUPAL: "Tu aventura comienza aquí" - Buscador
  Autocontenido: HTML + CSS en un único bloque, sin JS.
  · Actualiza la URL de la imagen de fondo (--ft-bg-image)
  · El formulario envía a /segittur-search?search=…
============================================================ -->

<style>
  #jaen-aventura {
    --ft-font:    'Montserrat', sans-serif;
    --ft-black:   #000;
    --ft-yellow:  #ffff00;
    --ft-white:   #fff;
    --ft-border:  #d9d9d9;
    --ft-grey:    #6b6b6b;
    /* ↓ Actualiza con la ruta real de tu imagen en Drupal */
    --ft-bg-image: url('/gestion_destino/diputacion_provincial_de_jaen/sites/diputacionprovincialdejaen/files/NOMBRE-IMAGEN.jpg');
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }
  #jaen-aventura *, #jaen-aventura *::before, #jaen-aventura *::after {
    box-sizing: inherit;
  }

  /* Sección */
  #jaen-aventura .ft-section {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 125px;
    padding-top: 40px;
    padding-bottom: 40px;
  }

  /* Padding y contenedor */
  #jaen-aventura .ft-padding {
    width: 100%;
    padding-left: 40px;
    padding-right: 40px;
  }
  #jaen-aventura .ft-container {
    width: 100%;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Bloque interior: título + buscador */
  #jaen-aventura .ft-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
  }

  /* Título */
  #jaen-aventura .ft-title {
    font-family: var(--ft-font);
    color: var(--ft-black);
    margin: 0;
    padding: 0;
    font-size: 30px;
    font-weight: 400;
    line-height: 36px;
  }

  /* Wrapper del buscador (limita el ancho) */
  #jaen-aventura .ft-search-wrap {
    width: 100%;
    max-width: 560px;
    margin-top: 10px;
    position: relative;
  }

  /* Formulario: cápsula con sombra */
  #jaen-aventura .ft-form {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    border: 1px solid var(--ft-border);
    border-radius: 75px;
    padding: 4px 4px 4px 18px;
    font-family: var(--ft-font);
    font-size: 16px;
    line-height: 20px;
    box-shadow: 0 4px 4px rgba(0, 0, 0, .25);
    background: var(--ft-white);
    gap: 8px;
  }

  /* Input de texto */
  #jaen-aventura .ft-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-family: var(--ft-font);
    font-size: 16px;
    font-weight: 500;
    line-height: 20px;
    color: var(--ft-black);
    min-width: 0;
  }
  #jaen-aventura .ft-input::placeholder {
    color: var(--ft-grey);
    font-weight: 400;
  }

  /* Botón submit: círculo amarillo con icono */
  #jaen-aventura .ft-submit {
    flex-shrink: 0;
    width: 35px;
    min-width: 35px;
    height: 35px;
    border: none;
    border-radius: 100px;
    background-color: var(--ft-yellow);
    background-image: url('/gestion_destino/diputacion_provincial_de_jaen/sites/diputacionprovincialdejaen/files/icon-ia-v3.png');
    background-position: center;
    background-repeat: no-repeat;
    background-size: 20px;
    cursor: pointer;
    transition: background-color .2s, filter .2s;
    padding: 0;
  }
  #jaen-aventura .ft-submit:hover {
    background-color: var(--ft-black);
    background-image: url('/gestion_destino/diputacion_provincial_de_jaen/sites/diputacionprovincialdejaen/files/icon-ia-v3-white.png');
  }

  /* ── Breakpoints ── */
  @media (min-width: 1280px) {
    #jaen-aventura .ft-title        { font-size: 35px; line-height: 42px; }
    #jaen-aventura .ft-section      { min-height: 155px; }
    #jaen-aventura .ft-inner        { gap: 2px; }
    #jaen-aventura .ft-form         { font-size: 18px; line-height: 22px; }
    #jaen-aventura .ft-input        { font-size: 18px; line-height: 22px; }
    #jaen-aventura .ft-submit       { width: 48px; min-width: 48px; height: 48px; background-size: 26px; }
  }

  @media (max-width: 991px) {
    #jaen-aventura .ft-title        { font-size: 28px; line-height: 34px; }
    #jaen-aventura .ft-section      { margin-bottom: 60px; }
    #jaen-aventura .ft-input        { font-size: 15px; line-height: 18px; }
  }

  @media (max-width: 767px) {
    #jaen-aventura .ft-padding      { padding-left: 25px; padding-right: 25px; }
    #jaen-aventura .ft-title        { font-size: 20px; line-height: 26px; }
    #jaen-aventura .ft-section      { margin-top: 20px; margin-bottom: 50px; }
    #jaen-aventura .ft-inner        { gap: 1px; }
    #jaen-aventura .ft-search-wrap  { padding-left: 0; padding-right: 0; }
    #jaen-aventura .ft-input        { font-size: 14px; line-height: 17px; }
  }

  @media (max-width: 479px) {
    #jaen-aventura .ft-padding      { padding-left: 25px; padding-right: 25px; }
    #jaen-aventura .ft-form         { height: 48px; font-size: 15px; line-height: 19px; }
    #jaen-aventura .ft-input        { font-size: 15px; line-height: 19px; }
  }
</style>

<div id="jaen-aventura">
  <section class="ft-section">
    <div class="ft-padding">
      <div class="ft-container">
        <div class="ft-inner">

          <h2 class="ft-title">TU AVENTURA COMIENZA AQUÍ</h2>

          <div class="ft-search-wrap">
            <form class="ft-form"
                  action="/segittur-search"
                  method="get"
                  autocomplete="off">
              <input class="ft-input"
                     type="text"
                     name="search"
                     placeholder="¿Qué quieres saber de Jaén?"
                     required>
              <button class="ft-submit" type="submit" aria-label="Buscar"></button>
            </form>
          </div>

        </div>
      </div>
    </div>
  </section>
</div>
