<div id="edition-block">
    <script>
        (function () {
            function initTabs() {
                // 1. Buscamos todos los contenedores de Segittur en la página
                const hosts = document.querySelectorAll('[id$="segittur_dynamic_list"]');

                hosts.forEach(host => {
                    // 2. Filtramos para actuar SOLO en el que tiene la pestaña de Jaén
                    const jaenTab = host.querySelector('[data-role="filter-one"][data-value^="Explora Jaén"]');
                    if (!jaenTab) return; // Si no es nuestro bloque, saltamos al siguiente

                    // 3. Buscamos las pestañas dentro de este bloque específico
                    const tabs = host.querySelectorAll('[data-role="tabs-one"] [data-role="filter-one"]');
                    if (tabs.length > 1) {
                        const todoTab = tabs[0];      // El botón "Todo(s)"
                        const firstRealTab = tabs[1]; // El botón "Explora Jaén..."

                        // Si ya está activa la primera opción, no hacemos nada para evitar bucles
                        if (firstRealTab.classList.contains('active')) return;

                        // 4. Modificamos las clases visuales de Tailwind
                        todoTab.classList.remove('active', 'after:scale-x-100');
                        todoTab.classList.add('after:scale-x-0');
                        firstRealTab.classList.add('active');
                        firstRealTab.classList.remove('after:scale-x-0');
                        firstRealTab.classList.add('after:scale-x-100');

                        // 5. Forzamos el click para que Segittur filtre las tarjetas abajo
                        setTimeout(() => {
                            firstRealTab.click();
                        }, 150);
                    }
                });

                // Si aún no se ha pintado ningún componente, reintentamos en 50ms
                if (hosts.length === 0) {
                    setTimeout(initTabs, 50);
                }
            }

            // Aseguramos la ejecución según la carga del documento
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initTabs);
            } else {
                initTabs();
            }
        }());
    </script>
