    <script>
        (function () {
            function initSegitturDates() {
                document.querySelectorAll('[id*="segittur_dynamic_list"]').forEach(function (host) {
                    var root = host.shadowRoot || host;
                    if (host.hasAttribute('data-dates-formatted')) return;
                    host.setAttribute('data-dates-formatted', '1');
                    root.querySelectorAll('.paginable-item blockquote mark').forEach(function (el) {
                        var cleanText = el.textContent.trim();
                        var parts = cleanText.split(' ')[0].split('-');
                        if (parts.length === 3) {
                            var meses = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
                            var dia = parseInt(parts[0], 10);
                            var mes = meses[parseInt(parts[1], 10) - 1];
                            el.className += " flex flex-col items-center justify-center text-center leading-tight min-w-[50px] py-1 px-2";
                            // Cambiado color:#000 por color:#fff para asegurar visibilidad en el nuevo fondo azul oscuro
                            el.innerHTML = '<span class="text-xl font-bold" style="opacity:1 !important; color:#fff !important;">' + dia + '</span>' +
                                '<span class="text-xs uppercase font-semibold tracking-wider" style="opacity:1 !important; color:#fff !important;">' + mes + '</span>';
                        }
                    });
                });
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initSegitturDates);
            } else {
                initSegitturDates();
            }
        }());
    </script>
